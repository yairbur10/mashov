<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משו"ב - שחרורית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f6;--surface:#fff;--ink:#1f1f1f;--muted:#6b6b6b;--line:#e3e3e3;--green:#0b5d3b;--accent:#4a58b8;--ok-bg:#c8ecc4;--ok-ink:#1d5a1d;--wait-bg:#fdeab0;--wait-ink:#6b4e00;--no-bg:#f8c9c4;--no-ink:#7a1c14;--row:#efefef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151515;--surface:#1f1f1f;--ink:#efefef;--muted:#a5a5a5;--line:#333;--green:#0a4a30;--accent:#8c97ee;--ok-bg:#285a2a;--ok-ink:#d4f5d0;--wait-bg:#5a4a12;--wait-ink:#fbe9ae;--no-bg:#6b2a24;--no-ink:#fbd5d1;--row:#2a2a2a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--green);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 18px;height:60px}
header h1{font-size:19px;font-weight:400;margin:0;flex:1}
header button{background:none;border:0;color:#fff;cursor:pointer;padding:6px;border-radius:50%;display:grid;place-items:center;position:relative}
header svg{width:24px;height:24px;fill:currentColor}
.badge{position:absolute;top:-4px;left:-6px;background:#e11;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-weight:700}
.sp{flex:1}
main{max-width:720px;margin:0 auto;padding:22px 16px 90px}
h2.page{font-size:34px;font-weight:700;margin:6px 4px 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.opts{border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin-bottom:16px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:17px;cursor:pointer}
.sw{position:relative;width:46px;height:20px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.sw .track{position:absolute;inset:0;border-radius:10px;background:#aaa;transition:background .2s}
.sw .thumb{position:absolute;top:-3px;right:-4px;width:26px;height:26px;border-radius:50%;background:#eee;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s,background .2s;display:grid;place-items:center}
.sw .thumb svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;opacity:0}
.sw input:checked~.track{background:#8f99d9}
.sw input:checked~.thumb{background:var(--accent);transform:translateX(-24px)}
.sw input:checked~.thumb svg{opacity:1}
.sw input:focus-visible~.thumb{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--row);border-radius:6px;padding:16px 14px 10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.card h3{font-size:30px;margin:0 0 14px;font-weight:700;line-height:1.15}
.head,.row{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 34px;align-items:center;gap:6px;text-align:center}
.head{color:var(--muted);font-size:18px;padding:6px 8px 10px;line-height:1.1}
.item{background:var(--surface);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.14);margin-bottom:10px;overflow:hidden}
.row{padding:12px 8px;min-height:60px;cursor:pointer;font-size:19px}
.row .date{display:flex;align-items:center;gap:6px;justify-content:center}
.row .chev{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.2;transition:transform .2s}
.item.open .chev{transform:rotate(180deg)}
.chip{display:inline-block;padding:10px 18px;border-radius:20px;font-size:16px}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}.chip.wait{background:var(--wait-bg);color:var(--wait-ink)}.chip.no{background:var(--no-bg);color:var(--no-ink)}
.kebab{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:50%}
.kebab svg{width:22px;height:22px;fill:currentColor;display:block}
.detail{display:none;padding:0 18px 14px;color:var(--muted);font-size:16px;line-height:1.6;border-top:1px dashed var(--line)}
.item.open .detail{display:block}
.detail b{color:var(--ink);font-weight:500}
.item.expired .row{opacity:.6}
.menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;min-width:150px;padding:4px}
.menu button{display:block;width:100%;text-align:right;background:none;border:0;color:var(--ink);font:inherit;padding:10px 12px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--row)}
.empty{text-align:center;color:var(--muted);padding:26px 0 18px;font-size:17px}
dialog{border:0;border-radius:12px;padding:22px;width:min(92vw,400px);background:var(--surface);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h4{margin:0 0 14px;font-size:22px}
label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
input[type=date],input[type=time],textarea{width:100%;font:inherit;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:10px;justify-content:flex-start;margin-top:20px}
.btn{font:500 16px 'Heebo',Arial,sans-serif;border-radius:20px;padding:10px 22px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.toast.show{opacity:1}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:420px){h2.page{font-size:30px}.card h3{font-size:26px}.row{font-size:17px}.chip{padding:8px 12px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>משו"ב - שחרורית</h1>
  <button aria-label="תפריט"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <span class="sp"></span>
  <button aria-label="בקשת שחרור חדשה" id="help"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 17h-2v-2h2zm2.1-7.8l-.9.9c-.7.7-1.2 1.3-1.2 2.9h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3c.4-.3.6-.8.6-1.4 0-1.1-.9-2-2-2s-2 .9-2 2H8a4 4 0 118 0c0 .9-.4 1.7-.9 2.2z"/></svg></button>
  <button aria-label="התראות"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 00-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1z"/></svg><span class="badge">11</span></button>
</header>

<main>
  <h2 class="page">שחרורית</h2>
  <section class="panel">
    <div class="opts">
      <label class="opt"><span>הצגת בקשות שפג תוקפן</span><span class="sw"><input type="checkbox" id="showExpired" checked><span class="track"></span><span class="thumb"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span></span></label>
      <label class="opt"><span>סידור בקשות מהחדש לישן</span><span class="sw"><input type="checkbox" id="newest" checked><span class="track"></span><span class="thumb"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span></span></label>
    </div>
    <div class="card">
      <h3>בקשות שחרור שנשלחו</h3>
      <div class="head"><span>תאריך שחרור</span><span>שעות</span><span>סטטוס</span><span></span></div>
      <div id="list"></div>
    </div>
  </section>
</main>


<dialog id="dlg">
  <h4>בקשת שחרור חדשה</h4>
  <label for="fDate">תאריך שחרור</label><input type="date" id="fDate">
  <label for="fTime">שעה</label><input type="time" id="fTime" value="11:00">
  <label for="fWhy">סיבה</label><textarea id="fWhy" rows="2" placeholder="למשל: תור לרופא"></textarea>
  <div class="acts"><button class="btn p" id="send">שליחה</button><button class="btn" id="cancel">ביטול</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const off=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return iso(d)};
let reqs=[
 {id:1,date:off(0),time:'11:00',status:'ok',why:'תור לרופא שיניים'},
 {id:2,date:off(-6),time:'12:30',status:'ok',why:'אירוע משפחתי'},
 {id:3,date:off(-13),time:'10:15',status:'ok',why:'ביקור במשרד הפנים'},
 {id:4,date:off(4),time:'09:50',status:'ok',why:'בדיקות דם'}
];
const label={ok:'התקבל',wait:'ממתין',no:'נדחה'};
const $=s=>document.querySelector(s);
const fmt=s=>{const [y,m,d]=s.split('-');return +d+'/'+ +m};
let nid=10,openId=null;
function render(){
  const showExp=$('#showExpired').checked,newest=$('#newest').checked;
  let rows=reqs.filter(r=>showExp||r.date>=iso(today));
  rows.sort((a,b)=>newest?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  $('#list').innerHTML=rows.length?rows.map(r=>{
    const exp=r.date<iso(today);
    return `<div class="item ${r.id===openId?'open':''} ${exp?'expired':''}" data-id="${r.id}">
    <div class="row" role="button" tabindex="0" aria-expanded="${r.id===openId}">
      <span class="date"><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>${fmt(r.date)}</span>
      <span>${r.time}</span>
      <span><span class="chip ${r.status}">${label[r.status]}</span></span>
      <button class="kebab" aria-label="אפשרויות"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </div>
    <div class="detail"><b>סיבה:</b> ${r.why.replace(/</g,'&lt;')}<br><b>תוקף:</b> ${exp?'פג תוקף':'בתוקף'}</div></div>`}).join(''):'<div class="empty">אין בקשות להצגה</div>';
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function closeMenu(){document.querySelectorAll('.menu').forEach(m=>m.remove())}
$('#list').addEventListener('click',e=>{
  const item=e.target.closest('.item');if(!item)return;const id=+item.dataset.id;
  if(e.target.closest('.kebab')){
    e.stopPropagation();closeMenu();
    const b=e.target.closest('.kebab').getBoundingClientRect();
    const m=document.createElement('div');m.className='menu';
    m.style.top=(b.bottom+scrollY)+'px';m.style.left=Math.max(8,b.left)+'px';
    m.innerHTML='<button data-a="d">הצגת פרטים</button><button data-a="x">ביטול בקשה</button>';
    m.addEventListener('click',ev=>{const a=ev.target.dataset.a;
      if(a==='d')openId=id;
      if(a==='x'){reqs=reqs.filter(r=>r.id!==id);toast('הבקשה בוטלה')}
      closeMenu();render()});
    document.body.appendChild(m);return}
  openId=openId===id?null:id;render();
});
$('#list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();e.target.click()}});
document.addEventListener('click',closeMenu);
['#showExpired','#newest'].forEach(s=>$(s).addEventListener('change',render));
$('#help').onclick=()=>{$('#fDate').value=off(1);$('#dlg').showModal()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#send').onclick=()=>{
  const d=$('#fDate').value,t=$('#fTime').value;
  if(!d||!t){toast('יש למלא תאריך ושעה');return}
  reqs.push({id:nid++,date:d,time:t,status:'ok',why:$('#fWhy').value.trim()||'לא צוינה סיבה'});
  $('#fWhy').value='';$('#dlg').close();toast('הבקשה נשלחה');render()};
render();
</script>
</body>
</html>
